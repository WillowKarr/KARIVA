<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — KARMASH</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    /* Если хостинг не умеет rewrites (не Vercel), прямые ссылки на кейсы всё равно откроются */
    var m = location.pathname.match(/^\/(design|art)\/([^/]+)\/?$/);
    if (m) location.replace('/' + m[1] + '/?case=' + encodeURIComponent(m[2]));
  </script>
  <link rel="stylesheet" href="/src/styles/tokens.css"><link rel="stylesheet" href="/src/styles/base.css">
  <style>.nf{min-height:100vh;display:grid;place-content:center;gap:24px;text-align:center;padding:24px}.nf h1{font:400 clamp(80px,18vw,220px)/.85 var(--font-hand)}</style>
</head>
<body><main class="nf"><h1>404</h1><p>Такой страницы нет.</p><p><a href="/">На главную</a></p></main></body>
</html>
