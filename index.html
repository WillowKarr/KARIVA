<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KARMASH — Дизайнер и художник</title>
  <!-- ✎ Описание для поисковиков и превью ссылки (до ~160 символов) -->
  <meta name="description" content="Портфолио Ивет Кармаш: дизайн и арт.">
  <meta name="theme-color" content="#dbdddc">
  <link rel="canonical" href="https://kariva.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="KARMASH — Дизайнер и художник">
  <meta property="og:description" content="Портфолио Ивет Кармаш: дизайн и арт.">
  <meta property="og:image" content="https://kariva.vercel.app/src/assets/og/og.jpg">
  <meta property="og:url" content="https://kariva.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/src/assets/fonts/ag-bengaly.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="/src/assets/fonts/tkachenko-sketch.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="/src/assets/collage/portrait.webp" as="image">
  <script>
    /* прелоадер показывается только при первом заходе и не при «уменьшить движение» */
    try { if (sessionStorage.getItem('kx-seen') || matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('no-preload'); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/home.css">
  <script type="module" src="/src/pages/home.js"></script>
</head>
<body id="top">
  <a class="skip-link" href="#about">Перейти к содержанию</a>

  <div class="preloader" aria-hidden="true">
    <div class="preloader__sheet">
      <span class="preloader__img"></span>
      <span class="preloader__line"></span>
      <img class="preloader__logo" src="/src/assets/logo/logo-black.svg" alt="" width="93" height="21">
      <svg class="preloader__mark" viewBox="0 0 24 24"><path d="M12 0 C12.8 8 15.5 11 24 12 C15.5 13 12.8 16 12 24 C11.2 16 8.5 13 0 12 C8.5 11 11.2 8 12 0Z" fill="currentColor"/></svg>
    </div>
  </div>

  <!-- ============ HOME ============ -->
  <header class="hero" id="home">
    <div class="hero__ticker" aria-hidden="true"><div class="hero__ticker-track" data-ticker></div></div>
    <div class="hero__nav">
      <a class="hero__logo" href="/" aria-label="KARMASH — на главную"><img src="/src/assets/logo/logo-black.svg" alt="KARMASH" width="93" height="21"></a>
      <nav aria-label="Основная навигация" data-nav></nav>
    </div>
    <div class="hero__stage">
      <div class="collage" data-collage></div>
    </div>
    <div class="hero__band">
      <h1 class="hero__title" data-hero-title>Ивет Кармаш</h1>
      <div class="hero__row">
        <p class="hero__text" data-text="heroText" data-hint="heroText — коротко о себе и о разделах сайта (site.js)"></p>
        <div class="hero__cta" data-hero-cta></div>
      </div>
    </div>
  </header>

  <main>
    <!-- ============ ABOUT ============ -->
    <section class="about" id="about" aria-labelledby="about-title">
      <span class="about__edge" aria-hidden="true"></span>
      <div class="wrap about__grid" data-decor="about">
        <figure class="about__photo reveal" style="--rr:-2deg">
          <span class="tape" aria-hidden="true"></span>
          <img data-about-photo src="" alt="" width="720" height="960" loading="lazy">
        </figure>
        <div class="about__body">
          <h2 class="section-title reveal" id="about-title" data-about-title></h2>
          <div class="about__text reveal" style="--rd:120ms" data-about-text></div>
          <aside class="about__facts reveal" style="--rd:220ms" data-about-facts></aside>
        </div>
      </div>

      <div class="wrap career" data-decor="career">
        <h2 class="section-title career__title reveal" data-career-title></h2>
        <div class="branch" data-timeline></div>
      </div>
    </section>

    <!-- ============ SKILLS ============ -->
    <section class="skills" aria-labelledby="skills-title">
      <h2 class="visually-hidden" id="skills-title" data-skills-title></h2>
      <div class="ticker" data-skills-ticker></div>
    </section>

    <section class="programs" aria-labelledby="programs-title">
      <div class="wrap">
        <div class="programs__sheet" data-decor="programs">
          <h2 class="section-title programs__title reveal" id="programs-title" data-programs-title></h2>
          <ul class="programs__grid" data-programs></ul>
        </div>
      </div>
    </section>

    <!-- ============ ART / DESIGN ============ -->
    <section class="albums" aria-label="Разделы портфолио">
      <div class="wrap albums__stack" data-decor="albums" data-albums></div>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <div class="wrap contact__grid" data-decor="contact" data-contact></div>
    </section>
  </main>

  <footer data-footer></footer>
</body>
</html>
